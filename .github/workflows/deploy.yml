name: Build and deploy Jupyter Book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate report evidence
        run: |
          python scripts/validate_report.py
          python scripts/check_parser_logic.py
          python scripts/check_pipeline.py
          python scripts/check_colab_workflow.py
          python scripts/validate_workflow.py
      - name: Execute Python cells and build HTML
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Validate generated artifacts
        run: python scripts/validate_html.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
